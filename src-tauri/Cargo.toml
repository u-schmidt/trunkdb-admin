[package]
name = "trunkdb-admin"
description = "TrunkDB Admin: a desktop tool for inspecting and managing trunkdb databases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# For UI tests through WebDriver only, built by scripts/build-wdio-test.sh.
# Off by default on purpose: the plugin starts an unauthenticated WebDriver
# server (JavaScript and full control of the window) on every launch, with
# no debug or release gate of its own. A normal build must never link it.
wdio-test = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
trunkdb-admin-core = { path = "../crates/admin-core" }
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Exactly the version verified beside @wdio/tauri-service 1.3.0.
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The version tao already uses; for `terminate.rs`.
objc2 = "0.6"
